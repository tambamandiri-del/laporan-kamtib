<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LAPORAN KAMTIB - Lapas Pekanbaru</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#081a35;color:white;min-height:100vh;padding:14px;padding-bottom:90px}
.header{text-align:center;padding:10px 0 6px}
.garuda{width:88px;height:auto;margin:0 auto;display:block;filter:drop-shadow(0 0 10px rgba(255,215,0,0.7))}
.title{color:#ffcc00;font-weight:900;font-size:21px;letter-spacing:0.5px;margin-top:8px}
.subtitle{color:#7da8ff;font-size:11px;letter-spacing:3.5px;margin-top:2px}
.card{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14);border-radius:18px;padding:12px;margin-top:12px}
.time-row{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.4);border-radius:28px;padding:8px 12px;border:1px solid rgba(255,204,0,0.25)}
.t-left{display:flex;align-items:center;gap:9px}
.t-icon{width:34px;height:34px;background:linear-gradient(135deg,#ffbf00,#ff7a00);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
.t-label{font-size:11px;color:#bbb}.t-val{font-size:14px;font-weight:800;color:#ffcc00}
.d-badge{background:rgba(0,255,180,0.12);border:1px solid rgba(0,255,180,0.28);color:#5affd0;border-radius:20px;padding:6px 12px;font-size:11px;font-weight:700}
.s-label{font-size:10px;letter-spacing:2.8px;color:#8fa3c7;font-weight:800;margin:14px 0 7px 4px;text-transform:uppercase}
.inp{background:white;color:#111;border-radius:11px;padding:13px 14px;width:100%;border:none;font-size:14px;font-weight:600;outline:none}
select.inp{appearance:none}
textarea.inp{resize:none;height:76px}
.cam-area{margin-top:10px;background:rgba(0,0,0,0.25);border:1px dashed rgba(255,255,255,0.25);border-radius:16px;min-height:220px;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;position:relative}
.cam-btn-main{background:linear-gradient(135deg,#ffcc00,#ff9500);color:#000;border:none;border-radius:14px;padding:16px 22px;font-weight:900;font-size:15px;width:100%}
.result-img{width:100%;height:auto;display:block;border-radius:12px}
.result-wrap{width:100%}
.btn{flex:1;border:none;border-radius:12px;padding:13px;font-weight:800;font-size:13px}
.btn-down{background:#ffcc00;color:#000}
.btn-re{background:rgba(255,255,255,0.12);color:white;border:1px solid rgba(255,255,255,0.2)}
.ok-msg{background:rgba(0,255,120,0.15);border:1px solid rgba(0,255,120,0.3);color:#3cffa0;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700;margin-top:10px;text-align:center;display:none}
</style>
</head>
<body>
<div class="header">
<img class="garuda" src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Garuda_Pancasila%2C_Coat_of_Arms_of_Indonesia.svg/300px-Garuda_Pancasila%2C_Coat_of_Arms_of_Indonesia.svg.png">
<div class="title">LAPORAN KAMTIB</div>
<div class="subtitle">LAPAS PEKANBARU</div>
</div>
<div class="card">
<div class="time-row">
<div class="t-left"><div class="t-icon">🕒</div><div><div class="t-label">Waktu Laporan</div><div class="t-val" id="jam">--:-- WIB</div></div></div>
<div class="d-badge" id="hari">--, --</div>
</div>
<div class="s-label">Detail Laporan</div>
<div style="margin-bottom:10px"><div style="font-size:12px;color:#aabdd8;margin-bottom:6px;font-weight:600">Tanggal Kejadian</div>
<input class="inp" id="tgl" type="text" value="14 Okt 2026"></div>
<div style="margin-bottom:10px"><div style="font-size:12px;color:#aabdd8;margin-bottom:6px;font-weight:600">Lokasi</div>
<select class="inp" id="lokasi">
<option>Blok A - Lapas Pekanbaru</option>
<option>Blok B - Lapas Pekanbaru</option>
<option>Blok C - Lapas Pekanbaru</option>
<option>Blok D - Lapas Pekanbaru</option>
<option>Blok Hunian Wanita</option>
<option>Pos Wasrik</option>
<option>Dapur</option>
<option>Area Brandgang</option>
<option>P2U - Pintu Utama</option>
<option>Lainnya</option>
</select></div>
<div><div style="font-size:12px;color:#aabdd8;margin-bottom:6px;font-weight:600">Uraian Laporan</div>
<textarea class="inp" id="uraian" placeholder="Uraian kejadian...">Kegiatan pengamanan dan monitoring Kamtib dalam keadaan aman dan kondusif.</textarea></div>
<div class="s-label">Foto + Watermark Otomatis</div>
<div class="cam-area" id="camArea">
<div id="placeholder" style="text-align:center;padding:20px">
<div style="font-size:42px;margin-bottom:10px">📸</div>
<div style="font-size:13px;color:#9ab0d0;margin-bottom:14px">Belum ada foto. Foto akan langsung<br>muncul di sini dengan watermark lengkap</div>
<button class="cam-btn-main" onclick="document.getElementById('fileInput').click()">TAP - BUKA KAMERA HP</button>
</div>
<div id="resultWrap" style="display:none;width:100%"><img id="hasilImg" class="result-img"></div>
</div>
<div class="ok-msg" id="okMsg">✅ Berhasil! Foto watermark muncul!</div>
<div id="actionRow" style="display:none;gap:10px;margin-top:12px;display:none">
<button class="btn btn-down" onclick="downloadFoto()">⬇️ DOWNLOAD</button>
<button class="btn btn-re" onclick="ulangFoto()">🔄 FOTO ULANG</button>
</div>
</div>
<input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none">
<script>
function updateJam(){
 const now=new Date();
 const jamStr=now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+' WIB';
 const hariStr=now.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short',year:'numeric'});
 document.getElementById('jam').textContent=jamStr;
 document.getElementById('hari').textContent=hariStr;
 return {jamStr,hariStr};
}
updateJam(); setInterval(updateJam,60000);
let lastDataUrl=null;
document.getElementById('fileInput').addEventListener('change',function(e){
 const file=e.target.files[0]; if(!file) return;
 const tgl=document.getElementById('tgl').value;
 const lokasi=document.getElementById('lokasi').value;
 const uraian=document.getElementById('uraian').value;
 const {jamStr,hariStr}=updateJam();
 const reader=new FileReader();
 reader.onload=function(ev){
   const img=new Image();
   img.onload=function(){
     const canvas=document.createElement('canvas');
     const ctx=canvas.getContext('2d');
     canvas.width=img.width; canvas.height=img.height;
     ctx.drawImage(img,0,0);
     const h=canvas.height,w=canvas.width;
     const barH=Math.floor(h*0.32);
     const y0=h-barH;
     const grad=ctx.createLinearGradient(0,y0,0,h);
     grad.addColorStop(0,'rgba(0,0,0,0)');
     grad.addColorStop(0.15,'rgba(0,0,0,0.85)');
     grad.addColorStop(1,'rgba(0,0,0,0.95)');
     ctx.fillStyle=grad; ctx.fillRect(0,y0,w,barH);
     ctx.fillStyle='#ffcc00'; ctx.fillRect(0,y0,w,Math.max(4,Math.floor(h*0.008)));
     const base=w/100; ctx.textBaseline='top';
     ctx.fillStyle='#ffcc00'; ctx.font=`bold ${Math.floor(base*4.2)}px sans-serif`;
     ctx.fillText('LAPORAN KAMTIB - LAPAS PEKANBARU', w*0.03, y0+base*2);
     ctx.fillStyle='white'; ctx.font=`bold ${Math.floor(base*3.2)}px sans-serif`;
     ctx.fillText(`📅 ${tgl} | 🕒 ${jamStr}`, w*0.03, y0+base*8);
     ctx.fillText(`📍 ${lokasi}`, w*0.03, y0+base*13);
     ctx.font=`${Math.floor(base*3)}px sans-serif`;
     const uraianText=`📝 ${uraian}`;
     const maxW=w*0.94; const words=uraianText.split(' '); let line='', yLine=y0+base*18.5; let lines=0;
     for(let n=0;n<words.length;n++){
       const test=line+words[n]+' ';
       if(ctx.measureText(test).width>maxW && n>0){
         ctx.fillText(line, w*0.03, yLine); line=words[n]+' '; yLine+=base*4; lines++; if(lines>2) break;
       } else line=test;
     }
     if(lines<=2) ctx.fillText(line, w*0.03, yLine);
     ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.font=`${Math.floor(base*2.2)}px sans-serif`;
     ctx.fillText(`Foto otomatis dengan watermark - ${hariStr}`, w*0.03, h-base*3);
     lastDataUrl=canvas.toDataURL('image/jpeg',0.92);
     document.getElementById('hasilImg').src=lastDataUrl;
     document.getElementById('placeholder').style.display='none';
     document.getElementById('resultWrap').style.display='block';
     document.getElementById('actionRow').style.display='flex';
     document.getElementById('okMsg').style.display='block';
   }; img.src=ev.target.result;
 }; reader.readAsDataURL(file);
});
function downloadFoto(){
 if(!lastDataUrl) return;
 const a=document.createElement('a'); a.href=lastDataUrl;
 a.download=`KAMTIB_${Date.now()}.jpg`; a.click();
}
function ulangFoto(){
 document.getElementById('fileInput').value='';
 document.getElementById('fileInput').click();
}
</script>
</body>
</html>
