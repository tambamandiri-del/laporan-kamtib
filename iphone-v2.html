<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAPORAN KAMTIB - LOGO KIRI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1931;font-family:Arial,sans-serif;padding:10px}
h2{text-align:center;color:#ffcc00;font-size:16px;margin-bottom:8px}
#canvasWrap{width:100%;max-width:500px;margin:0 auto;background:#000;border:3px solid #ffcc00;border-radius:8px;overflow:hidden;display:none}
#preview{width:100%;height:auto;display:block;max-height:70vh;object-fit:contain}
.controls{max-width:500px;margin:10px auto;background:#122845;padding:12px;border-radius:8px;display:flex;flex-direction:column;gap:8px}
label{color:#ffcc00;font-size:12px;font-weight:bold}
input,select{padding:10px;border-radius:6px;border:none;font-size:14px}
button{border:none;padding:14px;font-weight:bold;border-radius:8px;font-size:16px;cursor:pointer}
#btnKamera{background:#00c853;color:white;width:100%;font-size:18px}
#btnDownload{background:#ffcc00;color:#0a1931;width:100%;margin-top:5px}
.zoomRow{display:flex;gap:8px;align-items:center}
.zoomRow input{flex:1}
#placeholder{max-width:500px;margin:0 auto;background:#122845;border:3px solid #ffcc00;border-radius:8px;padding:40px 20px;text-align:center;color:#ffcc00}
#fotoInput{display:none}
</style>
</head>
<body>
<h2>LAPORAN KAMTIB<br>LAPAS PEKANBARU</h2>
<div id="placeholder">📸 Belum ada foto<br><small style="color:white">Klik "BUKA KAMERA"</small></div>
<div id="canvasWrap"><canvas id="preview"></canvas></div>
<div class="controls">
<label>📸 Foto Kegiatan:</label>
<button id="btnKamera" onclick="document.getElementById('fotoInput').click()">📷 BUKA KAMERA</button>
<input type="file" id="fotoInput" accept="image/*" capture="environment">
<div class="zoomRow"><label>🔍 Zoom:</label><input type="range" id="zoomSlider" min="50" max="150" value="100"><span id="zoomVal" style="color:white">100%</span></div>
<label>📍 Blok / Lokasi:</label>
<select id="blok">
<option>Blok A - Lapas Pekanbaru</option><option>Blok B</option><option>Blok C</option><option>Blok D</option><option>Blok E</option><option>Blok F</option>
<option>Blok BPN</option><option>Blok Tipikor</option><option>Blok Narkoba</option><option>Blok Wanita</option>
<option>Pos Tinggi 1</option><option>Pos Tinggi 2</option><option>Pos Tinggi 3</option><option>Pos Tinggi 4</option>
<option>Pos Wasrik</option><option>Pos P2U - Pintu Utama</option><option>Pos Komando</option>
<option>Area Steril</option><option>Area Brandgang</option><option>Dapur Lapas</option><option>Klinik</option><option>Aula</option><option>Lapangan</option><option>Masjid</option><option>Gereja</option><option>Ruang Kunjungan</option><option>Ruang KPLP</option><option>Ruang Kamtib</option>
<option>Lapas Pekanbaru - Umum</option>
</select>
<label>📝 Uraian:</label><input type="text" id="uraian" value="Kegiatan perawatan senjata api">
<button id="btnDownload" onclick="download()">⬇️ DOWNLOAD LAPORAN</button>
</div>
<script>
const canvas=document.getElementById('preview');const ctx=canvas.getContext('2d');
const canvasWrap=document.getElementById('canvasWrap');const placeholder=document.getElementById('placeholder');
let img=null;let zoom=100;
let logoKemen=new Image();logoKemen.crossOrigin="anonymous";logoKemen.src="logo-kemen.png";logoKemen.onerror=()=>{logoKemen=null;};
const fotoInput=document.getElementById('fotoInput');const zoomSlider=document.getElementById('zoomSlider');const zoomVal=document.getElementById('zoomVal');
zoomSlider.addEventListener('input',(e)=>{zoom=parseInt(e.target.value);zoomVal.textContent=zoom+"%";if(img)draw();});
fotoInput.addEventListener('change',(e)=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();reader.onload=(ev)=>{
    img=new Image();img.onload=()=>{
      zoom=100;zoomSlider.value=100;zoomVal.textContent="100%";
      placeholder.style.display="none";canvasWrap.style.display="block";
      document.getElementById('btnKamera').innerHTML="📷 GANTI FOTO";
      draw();
    };img.src=ev.target.result;
  };reader.readAsDataURL(file);
});
function draw(){
if(!img)return;
const baseW=1080;const imgAspect=img.width/img.height;let fotoH=baseW/imgAspect;if(fotoH>800)fotoH=800;
const textH=200;canvas.width=baseW;canvas.height=fotoH+textH;
ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);
const zoomFactor=zoom/100;const drawW=baseW*zoomFactor;const drawH=fotoH*zoomFactor;
const offsetX=(baseW-drawW)/2;const offsetY=(fotoH-drawH)/2;
ctx.drawImage(img,offsetX,offsetY,drawW,drawH);
if(logoKemen && logoKemen.complete && logoKemen.naturalWidth>0){
  const d=Math.floor(baseW*0.03);const k=Math.floor(baseW*0.01);
  const logoSize=Math.floor(baseW*0.19);
  const logoX=d+k+30;
  const logoY=Math.floor(fotoH*0.16);
  ctx.save();
  ctx.globalAlpha=0.38;
  ctx.drawImage(logoKemen,logoX,logoY,logoSize,logoSize);
  ctx.restore();
}
ctx.fillStyle="white";ctx.fillRect(0,fotoH,baseW,textH);
ctx.fillStyle="#ffcc00";ctx.fillRect(0,fotoH,baseW,6);
const d=Math.floor(baseW*0.03);const k=Math.floor(baseW*0.01);
const marginX=d+k+35;const marginY=42;
ctx.fillStyle="#0a1931";ctx.font="bold 26px Arial";ctx.fillText("LAPORAN KAMTIB - LAPAS PEKANBARU",marginX,fotoH+marginY);
ctx.fillStyle="#0a1931";ctx.font="bold 19px Arial";const now=new Date();
const tgl=now.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
const jam=now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+" WIB";
ctx.fillText("📅 "+tgl+" | 🕒 "+jam,marginX,fotoH+marginY+32);
const blok=document.getElementById('blok').value;const uraian=document.getElementById('uraian').value;
ctx.fillStyle="#333";ctx.font="bold 17px Arial";ctx.fillText("📍 "+blok,marginX,fotoH+marginY+58);
ctx.fillStyle="#555";ctx.font="15px Arial";let uraianTxt=uraian;if(uraianTxt.length>80)uraianTxt=uraianTxt.substring(0,80)+"...";
ctx.fillText(uraianTxt,marginX,fotoH+marginY+82);
const totalH=fotoH+textH;
ctx.fillStyle="#0a1931";ctx.fillRect(0,0,baseW,d);ctx.fillRect(0,totalH-d,baseW,d);ctx.fillRect(0,0,d,totalH);ctx.fillRect(baseW-d,0,d,totalH);
ctx.fillStyle="#ffcc00";ctx.fillRect(d,d,baseW-2*d,k);ctx.fillRect(d,totalH-d-k,baseW-2*d,k);ctx.fillRect(d,d,k,totalH-2*d);ctx.fillRect(baseW-d-k,d,k,totalH-2*d);
}
function download(){if(!img){alert("Buka kamera dulu Bang!");return;}draw();const link=document.createElement('a');link.download="KAMTIB-"+Date.now()+".jpg";link.href=canvas.toDataURL('image/jpeg',0.92);link.click();}
</script>
</body>
</html>
