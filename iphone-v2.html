<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Laporan Kamtib  - Lapas Pekanbaru</title>
<link rel="manifest" href="manifest.json?v=hd6">
<meta name="theme-color" content="#0a1931">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kamtib Lapas">
<link rel="apple-touch-icon" href="icon-180.png?v=hd6">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=hd6">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=hd6">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1931;font-family:Arial,sans-serif;padding:10px}
h2{text-align:center;color:#ffcc00;font-size:14px;margin-bottom:8px}
#canvasWrap{width:100%;max-width:500px;margin:0 auto;background:#000;border:3px solid #ffcc00;border-radius:8px;overflow:hidden;display:none}
#preview{width:100%;display:block}
.controls{max-width:500px;margin:10px auto;background:#122845;padding:12px;border-radius:8px;display:flex;flex-direction:column;gap:8px}
label{color:#ffcc00;font-size:12px;font-weight:bold}
input,select{padding:12px;border-radius:6px;border:none;font-size:15px}
button{border:none;padding:14px;font-weight:bold;border-radius:8px;font-size:15px;cursor:pointer}
#btnKamera{background:#00c853;color:white;width:100%;font-size:18px}
#btnDownloadJPG{background:#ffcc00;color:#0a1931;width:100%;font-size:18px}
#btnDownloadPNG{background:#00bcd4;color:white;width:100%;margin-top:6px}
.zoomRow{display:flex;gap:8px;align-items:center}
#placeholder{max-width:500px;margin:0 auto;background:#122845;border:3px solid #ffcc00;border-radius:8px;padding:40px 20px;text-align:center;color:#ffcc00}
#fotoInput{display:none}
#qualityInfo{background:#001a33;border:1px solid #00c853;color:#00ff88;padding:8px;border-radius:6px;font-size:11px;text-align:center}
</style>
</head>
<body>
<h2>LAPORAN KAMTIB</h2>
<div id="placeholder">📸 Belum ada foto<br><small style="color:white">Klik "BUKA KAMERA"</small></div>
<div id="canvasWrap"><canvas id="preview"></canvas></div>
<div class="controls">
<div id="qualityInfo"></div>
<label>📸 Foto Kegiatan:</label>
<button id="btnKamera" onclick="document.getElementById('fotoInput').click()">📷 BUKA KAMERA</button>
<input type="file" id="fotoInput" accept="image/*" capture="environment">
<div class="zoomRow"><label>🔍 Zoom:</label><input type="range" id="zoomSlider" min="50" max="150" value="100"><span id="zoomVal" style="color:white">100%</span></div>
<label>📍 Blok / Lokasi:</label>
<select id="blok">
<option>Blok A - Lapas Pekanbaru</option><option>Blok B</option><option>Blok C</option><option>Blok D</option><option>Blok E</option><option>Blok F</option>
<option>Blok BPN</option><option>Blok Tipikor</option><option>Blok Narkoba</option><option>Blok Wanita</option>
<option>Pos Tinggi 1</option><option>Pos Tinggi 2</option><option>Pos Tinggi 3</option><option>Pos Tinggi 4</option>
<option>Pos Wasrik</option><option>Pos P2U - Pintu Utama</option><option>Pos Komando</option>
<option>Area Steril</option><option>Area Brandgang</option><option>Dapur Lapas</option><option>Klinik Lapas</option><option>Aula Lapas</option><option>Lapangan Lapas</option><option>Masjid At-Taubah</option><option>Gereja Lapas</option><option>Ruang Kunjungan</option><option>Ruang KPLP</option><option>Ruang Kamtib</option>
<option>Lapas Pekanbaru - Umum</option>
</select>
<label>📝 Uraian:</label><input type="text" id="uraian" value="Kegiatan perawatan senjata api">
<button id="btnDownloadJPG" onclick="downloadHD('jpg')">⬇️ DOWNLOAD</button>
<button id="btnDownloadPNG" onclick="downloadHD('png')">⬇️ DOWNLOAD HD </button>
</div>
<script>
const canvas=document.getElementById('preview');const ctx=canvas.getContext('2d');
const canvasWrap=document.getElementById('canvasWrap');const placeholder=document.getElementById('placeholder');
let img=null;let zoom=100;
const fotoInput=document.getElementById('fotoInput');const zoomSlider=document.getElementById('zoomSlider');const zoomVal=document.getElementById('zoomVal');
zoomSlider.addEventListener('input',(e)=>{zoom=parseInt(e.target.value);zoomVal.textContent=zoom+"%";if(img)draw();});
fotoInput.addEventListener('change',(e)=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();reader.onload=(ev)=>{
    img=new Image();img.onload=()=>{
      zoom=100;zoomSlider.value=100;zoomVal.textContent="100%";
      placeholder.style.display="none";canvasWrap.style.display="block";
      document.getElementById('btnKamera').innerHTML="📷 GANTI FOTO";
      draw();
    };img.src=ev.target.result;
  };reader.readAsDataURL(file);
});
function draw(){
if(!img)return;
// PAKAI RESOLUSI ASLI - TIDAK DIKECILKAN! BIAR HD
const baseW = Math.max(img.width, 2160); // MINIMAL 2160px (4K) - SUPER HD
const imgAspect=img.width/img.height;
let fotoH=baseW/imgAspect;
// Jangan batasi 800 lagi, pakai tinggi asli biar gak blur
const textH=Math.floor(baseW*0.185); // proporsional
canvas.width=baseW;canvas.height=fotoH+textH;

// HIGH QUALITY RENDERING
ctx.imageSmoothingEnabled=true;
ctx.imageSmoothingQuality='high';

ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);
const z=zoom/100;const dw=baseW*z;const dh=fotoH*z;const ox=(baseW-dw)/2;const oy=(fotoH-dh)/2;
ctx.drawImage(img,ox,oy,dw,dh);

// TEKS PUTIH BAWAH
ctx.fillStyle="white";ctx.fillRect(0,fotoH,baseW,textH);
ctx.fillStyle="#ffcc00";ctx.fillRect(0,fotoH,baseW,Math.floor(baseW*0.006));

const d=Math.floor(baseW*0.03);const k=Math.floor(baseW*0.01);
const mx=d+k+35;const my=Math.floor(baseW*0.038);

// FONT BESAR - PROPORSIONAL HD
ctx.fillStyle="#0a1931";ctx.font=`bold ${Math.floor(baseW*0.024)}px Arial`;ctx.fillText("LAPORAN KAMTIB - LAPAS PEKANBARU",mx,fotoH+my);
ctx.fillStyle="#0a1931";ctx.font=`bold ${Math.floor(baseW*0.017)}px Arial`;const now=new Date();
const tgl=now.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
const jam=now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+" WIB";
ctx.fillText("📅 "+tgl+" | 🕒 "+jam,mx,fotoH+my+Math.floor(baseW*0.03));
const blok=document.getElementById('blok').value;const uraian=document.getElementById('uraian').value;
ctx.fillStyle="#333";ctx.font=`bold ${Math.floor(baseW*0.016)}px Arial`;ctx.fillText("📍 "+blok,mx,fotoH+my+Math.floor(baseW*0.055));
ctx.fillStyle="#555";ctx.font=`${Math.floor(baseW*0.014)}px Arial`;let txt=uraian;if(txt.length>90)txt=txt.substring(0,90)+"...";
ctx.fillText(txt,mx,fotoH+my+Math.floor(baseW*0.078));

const th=fotoH+textH;
ctx.fillStyle="#0a1931";ctx.fillRect(0,0,baseW,d);ctx.fillRect(0,th-d,baseW,d);ctx.fillRect(0,0,d,th);ctx.fillRect(baseW-d,0,d,th);
ctx.fillStyle="#ffcc00";ctx.fillRect(d,d,baseW-2*d,k);ctx.fillRect(d,th-d-k,baseW-2*d,k);ctx.fillRect(d,d,k,th-2*d);ctx.fillRect(baseW-d-k,d,k,th-2*d);
}
function downloadHD(format){
  if(!img){alert("Buka kamera dulu Bang!");return;}
  draw();
  if(format==='png'){
    // PNG 100% LOSSLESS - PALING TAJAM, FILE GEDE
    canvas.toBlob(function(blob){
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download="KAMTIB-SUPERHD-"+Date.now()+".png";
      document.body.appendChild(a);a.click();
      setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},200);
    },'image/png');
  }else{
    // JPG 100% QUALITY - TAJAM TAPI FILE LEBIH KECIL
    canvas.toBlob(function(blob){
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download="KAMTIB-HD-"+Date.now()+".jpg";
      document.body.appendChild(a);a.click();
      setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},200);
    },'image/jpeg',1.0); // 1.0 = 100% QUALITY!
  }
}
</script>
</body>
</html>
